        /* ==========================================
           2. TOAST & CONFIRMATION HELPERS
           ========================================== */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-navy';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-xl text-white shadow-xl ${bgCol} animate-fade-in font-medium text-sm`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showConfirm(title, description, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const titleEl = document.getElementById('confirm-title');
            const descEl = document.getElementById('confirm-desc');
            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');

            titleEl.textContent = title;
            descEl.textContent = description;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const handleOk = () => {
                cleanup();
                onConfirm();
            };
            const handleCancel = () => {
                cleanup();
            };
            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                okBtn.removeEventListener('click', handleOk);
                cancelBtn.removeEventListener('click', handleCancel);
            };

            okBtn.addEventListener('click', handleOk);
            cancelBtn.addEventListener('click', handleCancel);
        }

                            ${isFree ? 'Start Learning Now' : 'View Course & Enroll'}
                        </button>
                    </div>
                </div>
            </div>`;
        }

        function handleCourseClick(courseId) {
            const course = state.courses.find(c => c.id === courseId);
            if (!course) return;
            if (course.type === 'free') {
                navigate('course-player', { courseId });
            } else {
                // Check if enrolled
                const user = state.currentUser;
                const isEnrolled = user && state.enrollments.some(e => e.userId === user.id && e.courseId === courseId && e.status === 'approved');
                if (isEnrolled) {
                    navigate('course-player', { courseId });
                } else {
                    openEnrollmentModal(course);
                }
            }
        }

                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <h4 class="font-bold text-navy text-sm">Q${idx+1}. ${q.text} <span class="text-xs text-slate-400 font-normal">(${q.marks} Marks)</span></h4>
                                <div class="space-y-2">
                                    ${q.options.map((opt, oIdx) => `
                                        <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:border-primary hover:bg-purple-50/50 cursor-pointer transition text-sm">

                                        </label>
                                    `).join('')}

                        `).join('')}
                        <button type="submit" class="w-full py-4 bg-primary hover:bg-primaryHover text-white font-bold rounded-2xl shadow-xl shadow-primary/30 transition">
                            Submit Examination
                        </button>
                    </form>
                </main>
            </div>`;
        }

        function submitExamAnswers(e, examId) {
            e.preventDefault();
            const exam = state.examinations.find(ex => ex.id === examId);
            let score = 0;
            let total = exam.totalMarks;

            exam.questions.forEach(q => {
                const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (selected && parseInt(selected.value) === q.correctIndex) {
                    score += q.marks;
                } else if (selected) {
                    score -= (q.marks * exam.negativeMarking);
                }
            });

            score = Math.max(0, score);
            const percentage = Math.round((score / total) * 100);

            state.examResults.push({
                id: 'er_' + Date.now(),
                userId: state.currentUser.id,
                examId,
                score,
                totalMarks: total,
                percentage,
                date: new Date().toISOString().split('T')[0]
            });
            saveState();

            showConfirm('Examination Submitted!', `Your Score: ${score}/${total} (${percentage}%). View details in your dashboard.`, () => {
                navigate('student-dashboard', { tab: 'overview' });
            });
        }

        let appliedDiscountAmount = 0;
        function applyCouponPreview(originalPrice) {
            const codeInput = document.getElementById('pay-coupon').value.trim().toUpperCase();
            const coupon = state.coupons.find(c => c.code === codeInput && c.enabled);
            if (!coupon) {
                showToast('Invalid or expired coupon code.', 'error');
                return;
            }
            if (coupon.discountType === 'percentage') {
                appliedDiscountAmount = (originalPrice * coupon.discountValue) / 100;
            } else {
                appliedDiscountAmount = coupon.discountValue;
            }
            const finalPrice = Math.max(0, originalPrice - appliedDiscountAmount);
            document.getElementById('modal-total-price').textContent = `৳${finalPrice}`;
            showToast(`Coupon applied! Discount: ৳${appliedDiscountAmount}`, 'success');
        }

        function handlePaymentSubmission(e, courseId) {
            e.preventDefault();
            const course = state.courses.find(c => c.id === courseId);
            const method = document.getElementById('pay-method').value;
            const senderNumber = document.getElementById('pay-sender').value;
            const trxId = document.getElementById('pay-trx').value;
            const couponCode = document.getElementById('pay-coupon').value;
            const finalAmount = Math.max(0, course.discountPrice - appliedDiscountAmount);

            state.payments.push({
                id: 'pay_' + Date.now(),
                userId: state.currentUser.id,
                courseId: course.id,
                courseName: course.title,
                method,
                senderNumber,
                trxId,
                date: new Date().toISOString().split('T')[0],
                coupon: couponCode,
                amount: finalAmount,
                status: 'pending'
            });
            saveState();

            document.getElementById('enroll-modal').remove();
            showToast('Payment request submitted successfully! Pending admin approval.', 'success');
            navigate('student-dashboard', { tab: 'pending-requests' });
        }

                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Enrollment Management</h2>
                        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                    <tr>
                                        <th class="p-4">Student ID</th>
                                        <th class="p-4">Course ID</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Date</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${state.enrollments.map(en => `
                                        <tr>
                                            <td class="p-4 font-mono text-xs">${en.userId}</td>
                                            <td class="p-4 font-mono text-xs">${en.courseId}</td>

                case 'payments':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Payment Verification (bKash & Nagad)</h2>
                        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                    <tr>
                                        <th class="p-4">Course</th>
                                        <th class="p-4">Method & Sender</th>
                                        <th class="p-4">TrxID</th>
                                        <th class="p-4">Amount</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${state.payments.map(p => `
                                        <tr>
                                            <td class="p-4 font-bold text-navy">${p.courseName}</td>
                                            <td class="p-4">${p.method}<br><span class="text-xs text-slate-400">${p.senderNumber}</span></td>
                                            <td class="p-4 font-mono text-xs font-bold">${p.trxId}</td>
                                            <td class="p-4">৳${p.amount}</td>
                                            <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${p.status==='approved'?'bg-emerald-100 text-emerald-700':p.status==='rejected'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}">${p.status}</span></td>
                                            <td class="p-4 flex gap-2">
                                                ${p.status === 'pending' ? `
                                                    <button onclick="approvePayment('${p.id}')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">Approve</button>
                                                    <button onclick="rejectPayment('${p.id}')" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-bold">Reject</button>
                                                ` : '<span class="text-xs text-slate-400">Processed</span>'}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;

                case 'revenue':
                    const approved = state.payments.filter(p => p.status === 'approved');
                    const revTotal = approved.reduce((acc, p) => acc + p.amount, 0);
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-bold text-navy">Revenue Management</h2>
                            <button onclick="showToast('CSV Export generated successfully!', 'success')" class="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-xl">Export CSV</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-xs text-slate-500 uppercase font-bold">Total Approved Revenue</p>
                                <p class="text-4xl font-extrabold text-emerald-600 mt-1">৳${revTotal.toLocaleString()}</p>
                            </div>
                            <span class="px-4 py-2 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold">${approved.length} Transactions Approved</span>
                        </div>
                    </div>`;

                case 'coupons':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-bold text-navy">Coupon Management</h2>
                            <button onclick="openAddCouponModal()" class="px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-xl">+ Create Coupon</button>
                        </div>
                        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                                    <tr>
                                        <th class="p-4">Code</th>
                                        <th class="p-4">Discount</th>
                                        <th class="p-4">Usage Count</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${state.coupons.map(cp => `
                                        <tr>
                                            <td class="p-4 font-mono font-bold text-navy">${cp.code}</td>
                                            <td class="p-4">${cp.discountType === 'percentage' ? cp.discountValue + '%' : '৳' + cp.discountValue}</td>
                                            <td class="p-4">${cp.usedCount} / ${cp.usageLimit}</td>
                                            <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${cp.enabled?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-600'}">${cp.enabled?'Active':'Disabled'}</span></td>
                                            <td class="p-4"><button onclick="deleteCoupon('${cp.id}')" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg text-xs font-bold">Delete</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;

                case 'categories':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Subject & Category Management</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <div class="flex flex-wrap gap-2">
                                ${state.categories.map(cat => `
                                    <span class="px-4 py-2 bg-purple-50 text-primary font-bold rounded-xl text-xs flex items-center gap-2">
                                        ${cat}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>`;

                case 'examinations':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Examination Management</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-slate-500 mb-4">Manage mock tests, MCQ questions, and view student exam submissions.</p>
                            <button onclick="showToast('Exam creation modal opened', 'info')" class="px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-xl">+ Create New Examination</button>
                        </div>
                    </div>`;

                case 'comments':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Comments & Student Moderation</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center py-12">
                            <p class="text-slate-400 text-sm">No flagged comments or student queries requiring moderation.</p>
                        </div>
                    </div>`;

                case 'announcements':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-bold text-navy">Announcements Management</h2>
                            <button onclick="openAddAnnouncementModal()" class="px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-xl">+ Post Announcement</button>
                        </div>
                        <div class="space-y-4">
                            ${state.announcements.map(a => `
                                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                    <div>
                                        <h4 class="font-bold text-navy">${a.title}</h4>
                                        <p class="text-xs text-slate-500 mt-1">${a.text}</p>
                                    </div>
                                    <button onclick="deleteAnnouncement('${a.id}')" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg text-xs font-bold">Delete</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;

                case 'notifications':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Broadcast Notifications</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <button onclick="showToast('Broadcast notification sent to all students!', 'success')" class="px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-xl">Send Notification to All Students</button>
                        </div>
                    </div>`;

                case 'reports':
                    return `
                    <div class="space-y-6 animate-fade-in">
                        <h2 class="text-xl font-bold text-navy">Reports & Advanced Analytics</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-sm text-slate-500">Comprehensive CSV reports on student enrollments, course performance, and financial logs.</p>
                        </div>
                    </div>`;

                case 'settings':
                    return `
                    <div class="space-y-6 animate-fade-in max-w-xl">
                        <h2 class="text-xl font-bold text-navy">Website Settings & System Reset</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h4 class="font-bold text-navy text-sm">Demo Data Reset Option</h4>
                            <p class="text-xs text-slate-500">Restore all courses, mock data, and reset demo state to factory defaults.</p>
                            <button onclick="resetDemoData()" class="px-4 py-3 bg-rose-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-rose-600/30">
                                Reset Demo Data & Cache
                            </button>
                        </div>
                    </div>`;

                case 'admin-profile':
                    return `
                    <div class="space-y-6 animate-fade-in max-w-xl">
                        <h2 class="text-xl font-bold text-navy">Admin Profile</h2>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Admin Name</label>
                                <input type="text" value="Dr. Sohag Bhai" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
                                <input type="text" value="sohag@mbbs.com" disabled class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                            </div>
                        </div>
                    </div>`;

                default:
                    return '';
            }
        }

        /* --- ADMIN ACTIONS & MODALS --- */
        function approvePayment(payId) {
            const pay = state.payments.find(p => p.id === payId);
            if (!pay) return;
            pay.status = 'approved';

            // Unlock course for user
            state.enrollments.push({
                id: 'en_' + Date.now(),
                userId: pay.userId,
                courseId: pay.courseId,
                status: 'approved',
                enrolledAt: new Date().toISOString().split('T')[0]
            });

            // Send notification
            state.notifications.push({
                id: 'nf_' + Date.now(),
                userId: pay.userId,
                title: 'Payment Approved!',
                message: `Your payment for ${pay.courseName} has been verified and approved. Course unlocked!`,
                date: new Date().toISOString().split('T')[0],
                read: false
            });

            saveState();
            showToast('Payment approved & course unlocked for student!', 'success');
            renderApp();
        }

        function rejectPayment(payId) {
            const pay = state.payments.find(p => p.id === payId);
            if (!pay) return;
            pay.status = 'rejected';
            saveState();
            showToast('Payment rejected.', 'error');
            renderApp();
        }

        function deleteCourse(courseId) {
            showConfirm('Delete Course', 'Are you sure you want to delete this course?', () => {
                state.courses = state.courses.filter(c => c.id !== courseId);
                saveState();
                showToast('Course deleted successfully.', 'success');
                renderApp();
            });
        }

        function deleteCoupon(couponId) {
            state.coupons = state.coupons.filter(c => c.id !== couponId);
            saveState();
            showToast('Coupon deleted.', 'success');
            renderApp();
        }

        function deleteAnnouncement(annId) {
            state.announcements = state.announcements.filter(a => a.id !== annId);
            saveState();
            showToast('Announcement deleted.', 'success');
            renderApp();
        }

        function openAddCourseModal() {
            const modalHTML = `
            <div id="add-course-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl animate-fade-in space-y-6 max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-navy text-xl">Add New Course</h3>
                        <button onclick="document.getElementById('add-course-modal').remove()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="handleCreateCourse(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Course Title</label>
                            <input type="text" id="ac-title" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Category</label>
                            <select id="ac-cat" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white">
                                ${state.categories.map(cat => `<option>${cat}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Course Type</label>
                            <select id="ac-type" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white">
                                <option value="free">Free</option>
                                <option value="premium">Premium</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Original Price (৳)</label>
                                <input type="number" id="ac-price" value="2500" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Discount Price (৳)</label>
                                <input type="number" id="ac-disc" value="1800" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Description</label>
                            <textarea id="ac-desc" rows="3" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3.5 bg-primary text-white font-bold rounded-xl shadow-lg">Publish Course</button>
                    </form>
                </div>
            </div>`;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div.firstElementChild);
        }

        function handleCreateCourse(e) {
            e.preventDefault();
            const title = document.getElementById('ac-title').value;
            const category = document.getElementById('ac-cat').value;
            const type = document.getElementById('ac-type').value;
            const price = parseFloat(document.getElementById('ac-price').value) || 0;
            const discountPrice = parseFloat(document.getElementById('ac-disc').value) || 0;
            const description = document.getElementById('ac-desc').value;

            const newCourse = {
                id: 'c_' + Date.now(),
                title,
                category,
                type,
                price,
                discountPrice,
                thumbnail: 'https://placehold.co/600x400/6C3CE9/FFFFFF?text=' + encodeURIComponent(category),
                description,
                isFeatured: true,
                isPublished: true,
                chapters: [
                    {
                        id: 'ch_' + Date.now(),
                        title: 'Module 1: Introduction & Fundamentals',
                        topics: [
                            { id: 't_' + Date.now(), title: 'Orientation Lecture', videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', duration: '20 mins', pdfName: 'Notes.pdf' }
                        ]
                    }
                ],
                announcements: []
            };

            state.courses.push(newCourse);
            saveState();
            document.getElementById('add-course-modal').remove();
            showToast('Course created successfully and published to website!', 'success');
            renderApp();
        }

        function openAddCouponModal() {
            const modalHTML = `
            <div id="add-coupon-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl animate-fade-in space-y-6">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-navy text-xl">Create Coupon</h3>
                        <button onclick="document.getElementById('add-coupon-modal').remove()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="handleCreateCoupon(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Coupon Code</label>
                            <input type="text" id="cp-code" placeholder="MBBS2026" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm uppercase">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Discount Type</label>
                            <select id="cp-type" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white">
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (৳)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Discount Value</label>
                            <input type="number" id="cp-val" value="15" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                        </div>
                        <button type="submit" class="w-full py-3.5 bg-primary text-white font-bold rounded-xl shadow-lg">Save Coupon</button>
                    </form>
                </div>
            </div>`;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div.firstElementChild);
        }

        function handleCreateCoupon(e) {
            e.preventDefault();
            const code = document.getElementById('cp-code').value.toUpperCase();
            const discountType = document.getElementById('cp-type').value;
            const discountValue = parseFloat(document.getElementById('cp-val').value) || 0;

            state.coupons.push({
                id: 'cp_' + Date.now(),
                code,
                discountType,
                discountValue,
                expiryDate: '2026-12-31',
                usageLimit: 100,
                usedCount: 0,
                enabled: true
            });
            saveState();
            document.getElementById('add-coupon-modal').remove();
            showToast('Coupon created successfully!', 'success');
            renderApp();
        }

        function openAddAnnouncementModal() {
            const modalHTML = `
            <div id="add-ann-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl animate-fade-in space-y-6">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-navy text-xl">Post Announcement</h3>
                        <button onclick="document.getElementById('add-ann-modal').remove()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onsubmit="handleCreateAnnouncement(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Title</label>
                            <input type="text" id="ann-title" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Announcement Text</label>
                            <textarea id="ann-text" rows="3" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm"></textarea>
                        </div>
                        <button type="submit" class="w-full py-3.5 bg-primary text-white font-bold rounded-xl shadow-lg">Publish Announcement</button>
                    </form>
                </div>
            </div>`;
            const div = document.createElement('div');
            div.innerHTML = modalHTML;
            document.body.appendChild(div.firstElementChild);
        }

        function handleCreateAnnouncement(e) {
            e.preventDefault();
            const title = document.getElementById('ann-title').value;
            const text = document.getElementById('ann-text').value;

            state.announcements.unshift({
                id: 'an_' + Date.now(),
                title,
                text,
                date: new Date().toISOString().split('T')[0]
            });
            saveState();
            document.getElementById('add-ann-modal').remove();
            showToast('Announcement posted successfully!', 'success');
            renderApp();
        }

        /* --- GLOBAL EVENT LISTENERS --- */
        function attachGlobalEventListeners() {
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.onclick = () => {
                    mobileMenu.classList.toggle('hidden');
                };
            }

            // Render Chart.js if canvas exists
            const chartCanvas = document.getElementById('adminRevenueChart');
            if (chartCanvas) {
                new Chart(chartCanvas, {
                    type: 'bar',
                    data: {
                        labels: ['January', 'February', 'March', 'April', 'May', 'June'],
                        datasets: [{
                            label: 'Monthly Revenue (৳)',
                            data: [12500, 18400, 24000, 31000, 42000, 58000],
                            backgroundColor: '#6C3CE9',
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }

        // Initial Boot
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
